services:
  kairo:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: /app/data/kairo.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - kairo-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    command: ["pnpm", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: /app/data/kairo.db
    volumes:
      - kairo-data:/app/data
    depends_on:
      kairo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kairo-data:
